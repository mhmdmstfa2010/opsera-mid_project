# Static SPA server for the react-router BrowserRouter build.
# Unknown paths must fall back to index.html, otherwise deep links
# (/student/register etc.) return 404 on refresh.
#
# Port 8080, not 80/3000: OpenShift's default SCC forbids binding any port
# below 1024 as the arbitrary (non-root) UID it assigns, and 3000 was only
# ever the CRA dev-server port. 8080 is unprivileged, so the same port works
# locally and on the cluster.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # CRA output is content-hashed except index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
