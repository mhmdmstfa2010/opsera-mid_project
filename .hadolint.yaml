# Gate 1 config — hadolint.
#
# Neither Dockerfile runs `apk add` any more (both only `apk upgrade` base
# packages after moving off the EOL node:14 / adoptopenjdk bases), so this
# ignore is currently unused — it is kept deliberately so that adding a
# diagnostic tool with `apk add <tool>` does not fail the gate purely for a
# missing patch-level pin that the next rebuild picks up anyway.
ignored:
  - DL3018 # apk add without version pins

# Info-level suggestions (e.g. DL3015 "use --no-install-recommends") are
# reported but do not block — warnings and errors do.
failure-threshold: warning
