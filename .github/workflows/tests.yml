# ==============================================================================
# tests.yml
# ==============================================================================
# FUNCTION
#   Runs the backend (JUnit/Surefire + JaCoCo) and frontend (Jest) test suites,
#   then publishes the results as commit checks via dorny/test-reporter.
#
# ROLE IN PIPELINE
#   Unit tests. Runs in parallel with gitleaks and lint.
#
# SECRETS READ
#   (none)
#
# REPOSITORY VARIABLES READ
#   (none)
#
# NOTES
#   Reads no secrets and no repository variables. Two publisher steps are used
#   because Surefire emits Java JUnit XML and jest-junit emits its own dialect,
#   and test-reporter takes exactly one `reporter` format per invocation.
# ==============================================================================

name: tests

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Backend tests + JaCoCo coverage
        id: test-backend
        continue-on-error: true
        working-directory: backend
        run: |
          ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests + coverage
        id: test-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # --passWithNoTests: Jest exits 1 on "No tests found", which would
          # fail the whole test job before any result could be published.
          # (The frontend DOES have suites under frontend/src — the flag is
          # belt-and-braces, not a workaround for their absence.)
          # Coverage still lands in coverage/lcov.info (Jest default).
          #
          # --reporters: jest-junit writes frontend/junit.xml, the file the
          # dorny/test-reporter step below reads. Without it only the backend
          # results would ever be published. `default` is kept so the
          # console output is unchanged.
          npm test -- --coverage --watchAll=false --passWithNoTests --ci \
            --reporters=default --reporters=jest-junit

      - name: Archive coverage + test reports
        if: always()
        run: |
          mkdir -p report-out/backend report-out/frontend
          [ -d backend/target/site/jacoco ] && cp -r backend/target/site/jacoco report-out/backend/
          [ -d backend/target/surefire-reports ] && cp -r backend/target/surefire-reports report-out/backend/
          [ -d frontend/coverage ] && cp -r frontend/coverage report-out/frontend/
          tar -czf test-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        id: upload-test-report
        if: always()
        with:
          name: test-report
          path: test-report.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        id: upload-coverage-raw
        if: always()
        with:
          name: coverage-raw
          path: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          retention-days: 1

      # Raw JUnit XML for the ci-summary job, which builds the combined
      # dashboard from it rather than from console output.
      - uses: actions/upload-artifact@v4
        id: upload-test-results
        if: always()
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            frontend/junit.xml
          retention-days: 7
          if-no-files-found: warn

      # dorny/test-reporter REPLACES EnricoMi/publish-unit-test-result-action.
      # Running both would publish the same XML twice as two competing check
      # runs on every commit.
      #
      # Two invocations, not one: `reporter` is a single required format and
      # the action rejects a `path` whose files are not all the same format.
      # Surefire emits Java JUnit XML and jest-junit emits its own dialect, so
      # each needs its own step.
      #
      # Pinned to the immutable commit SHA for the v3.0.0 tag (2026-03-21)
      # rather than the moving `@v3` ref, per this repo's no-floating-pin rule.
      - name: Publish backend test results
        id: report-backend-results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results (backend)
          reporter: java-junit
          path: backend/target/surefire-reports/TEST-*.xml
          # The full per-suite table is printed by the "📊 CI summary"
          # aggregator; this job stays SHORT so numbers are not shown twice.
          # The commit check and the per-failure annotations are unaffected.
          use-actions-summary: "false"
          list-suites: none
          list-tests: failed
          max-annotations: "10"
          # Reporting only — this job's verdict comes from the pass/fail step
          # below, which is what decides the build.
          fail-on-error: "false"

      - name: Publish frontend test results
        id: report-frontend-results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results (frontend)
          reporter: jest-junit
          path: frontend/junit.xml
          use-actions-summary: "false"
          list-suites: none
          list-tests: failed
          max-annotations: "10"
          fail-on-error: "false"
          # REQUIRED here. Verified: jest-junit still writes junit.xml when
          # every suite is skipped, but it contains zero testcases, and
          # `fail-on-empty` defaults to TRUE — so without this the frontend
          # step would fail the whole job on a green run.
          fail-on-empty: "false"

      # SHORT summary: verdict + headline count + links. The full per-suite
      # table is produced by the "📊 CI summary" aggregator job.
      - name: Pass/fail message
        if: always()
        env:
          REPORT_URL: ${{ steps.upload-test-report.outputs.artifact-url }}
          RESULTS_URL: ${{ steps.upload-test-results.outputs.artifact-url }}
          COVERAGE_URL: ${{ steps.upload-coverage-raw.outputs.artifact-url }}
        run: |
          total=$(grep -ho 'tests="[0-9]*"' backend/target/surefire-reports/TEST-*.xml frontend/junit.xml 2>/dev/null \
            | grep -o '[0-9]*' | paste -sd+ | bc 2>/dev/null || echo "")
          if [ "${{ steps.test-backend.outcome }}" == "success" ] && [ "${{ steps.test-frontend.outcome }}" == "success" ]; then
            echo "✅ test: passed — ${total:-all} tests green (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
            RC=0
          else
            FAILED=""
            [ "${{ steps.test-backend.outcome }}" != "success" ] && FAILED="$FAILED backend"
            [ "${{ steps.test-frontend.outcome }}" != "success" ] && FAILED="$FAILED frontend"
            echo "❌ test: failed —$FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
            RC=1
          fi
          {
            [ -n "$RESULTS_URL" ] && echo "[🧪 Test results]($RESULTS_URL)"
            [ -n "$REPORT_URL" ] && echo "[📄 Test report]($REPORT_URL)"
            [ -n "$COVERAGE_URL" ] && echo "[📈 Coverage input]($COVERAGE_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${RC:-0}
