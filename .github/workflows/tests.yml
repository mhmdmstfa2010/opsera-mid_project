name: tests

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Backend tests + JaCoCo coverage
        id: test-backend
        continue-on-error: true
        working-directory: backend
        run: |
          ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests + coverage
        id: test-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # --passWithNoTests: this repo currently has no frontend test
          # files, and Jest exits 1 on "No tests found" which failed the
          # whole test job. Coverage still lands in coverage/lcov.info
          # (Jest default) whenever tests do exist.
          #
          # --reporters: jest-junit writes frontend/junit.xml, the file the
          # test-reporter step below reads. Without it only the backend
          # results would ever be published. `default` is kept so the
          # console output is unchanged.
          npm test -- --coverage --watchAll=false --passWithNoTests --ci \
            --reporters=default --reporters=jest-junit

      - name: Archive coverage + test reports
        if: always()
        run: |
          mkdir -p report-out/backend report-out/frontend
          [ -d backend/target/site/jacoco ] && cp -r backend/target/site/jacoco report-out/backend/
          [ -d backend/target/surefire-reports ] && cp -r backend/target/surefire-reports report-out/backend/
          [ -d frontend/coverage ] && cp -r frontend/coverage report-out/frontend/
          tar -czf test-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-raw
          path: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          retention-days: 1

      - name: Publish test results to the run summary
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            frontend/junit.xml
          reporter: java-junit
          # Renders a per-suite table (pass/fail/skip counts, duration,
          # slowest tests) straight into this job's summary.
          use-actions-summary: true
          max-annotations: 20
          # The frontend has no test files yet, so the glob can legitimately
          # match nothing — that must not turn the job red.
          fail-on-empty: false
          # Publishing is reporting, not a gate; the job verdict comes from
          # the pass/fail message below.
          fail-on-error: true

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.test-backend.outcome }}" == "success" ] && [ "${{ steps.test-frontend.outcome }}" == "success" ]; then
            echo "✅ test: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            FAILED=""
            [ "${{ steps.test-backend.outcome }}" != "success" ] && FAILED="$FAILED backend"
            [ "${{ steps.test-frontend.outcome }}" != "success" ] && FAILED="$FAILED frontend"
            echo "❌ test: failed —$FAILED (see test-report artifact)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
