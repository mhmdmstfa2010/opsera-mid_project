name: tests

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Backend tests + JaCoCo coverage
        id: test-backend
        continue-on-error: true
        working-directory: backend
        run: |
          ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests + coverage
        id: test-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # --passWithNoTests: this repo currently has no frontend test
          # files, and Jest exits 1 on "No tests found" which failed the
          # whole test job. Coverage still lands in coverage/lcov.info
          # (Jest default) whenever tests do exist.
          #
          # --reporters: jest-junit writes frontend/junit.xml, the file the
          # test-reporter step below reads. Without it only the backend
          # results would ever be published. `default` is kept so the
          # console output is unchanged.
          npm test -- --coverage --watchAll=false --passWithNoTests --ci \
            --reporters=default --reporters=jest-junit

      - name: Archive coverage + test reports
        if: always()
        run: |
          mkdir -p report-out/backend report-out/frontend
          [ -d backend/target/site/jacoco ] && cp -r backend/target/site/jacoco report-out/backend/
          [ -d backend/target/surefire-reports ] && cp -r backend/target/surefire-reports report-out/backend/
          [ -d frontend/coverage ] && cp -r frontend/coverage report-out/frontend/
          tar -czf test-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        id: upload-test-report
        if: always()
        with:
          name: test-report
          path: test-report.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        id: upload-coverage-raw
        if: always()
        with:
          name: coverage-raw
          path: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          retention-days: 1

      # Raw JUnit XML for the ci-summary job, which builds the combined
      # dashboard from it rather than from console output.
      - uses: actions/upload-artifact@v4
        id: upload-test-results
        if: always()
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            frontend/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            backend/target/surefire-reports/TEST-*.xml
            frontend/junit.xml
          check_name: Test Results
          report_individual_runs: "true"
          # The per-suite table is printed by the "📊 CI summary" aggregator
          # job; this job stays SHORT so the numbers are not shown twice.
          # The commit check, the per-failure annotations and the PR comment
          # are all unaffected by turning the job summary off here.
          job_summary: "false"
          check_run: "true"
          comment_mode: changes
          # A glob that matches nothing is a warning, not a failure — the
          # frontend has no test files yet and the backend glob is expected
          # to supply the results.
          fail_on: test failures
          # Reporting only — the verdict for this job comes from the pass/fail
          # step below, and this action never fails the build on test failures
          # by default.
          action_fail: "false"

      # SHORT summary: verdict + headline count + links. The full per-suite
      # table is produced by the "📊 CI summary" aggregator job.
      - name: Pass/fail message
        if: always()
        env:
          REPORT_URL: ${{ steps.upload-test-report.outputs.artifact-url }}
          RESULTS_URL: ${{ steps.upload-test-results.outputs.artifact-url }}
          COVERAGE_URL: ${{ steps.upload-coverage-raw.outputs.artifact-url }}
        run: |
          total=$(grep -ho 'tests="[0-9]*"' backend/target/surefire-reports/TEST-*.xml frontend/junit.xml 2>/dev/null \
            | grep -o '[0-9]*' | paste -sd+ | bc 2>/dev/null || echo "")
          if [ "${{ steps.test-backend.outcome }}" == "success" ] && [ "${{ steps.test-frontend.outcome }}" == "success" ]; then
            echo "✅ test: passed — ${total:-all} tests green (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
            RC=0
          else
            FAILED=""
            [ "${{ steps.test-backend.outcome }}" != "success" ] && FAILED="$FAILED backend"
            [ "${{ steps.test-frontend.outcome }}" != "success" ] && FAILED="$FAILED frontend"
            echo "❌ test: failed —$FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
            RC=1
          fi
          {
            [ -n "$RESULTS_URL" ] && echo "[🧪 Test results]($RESULTS_URL)"
            [ -n "$REPORT_URL" ] && echo "[📄 Test report]($REPORT_URL)"
            [ -n "$COVERAGE_URL" ] && echo "[📈 Coverage input]($COVERAGE_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${RC:-0}
