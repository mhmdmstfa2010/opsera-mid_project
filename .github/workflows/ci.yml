name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: pipeline scope
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] && { \
               [ "${{ github.ref }}" = "refs/heads/main" ] || \
               [ "${{ github.ref }}" = "refs/heads/develop" ]; }; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Pipeline scope: **release**"
              echo ""
              echo "Push to a protected branch — the full pipeline runs and a"
              echo "GitOps pull request will be opened for the new image tag."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Pipeline scope: **analysis only**"
              echo ""
              echo "No image is built, pushed or signed, and the GitOps repo is"
              echo "never touched. Those steps run only on a push to \`main\` or \`develop\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  gitleaks:
    name: Gate 0 · gitleaks
    permissions:
      contents: read
      security-events: write # the called workflow uploads SARIF to code scanning
    uses: ./.github/workflows/gate-0-gitleaks.yml
    secrets: inherit

  lint:
    name: Gate 1 · lint
    permissions:
      contents: read
    uses: ./.github/workflows/gate-1-lint.yml
    secrets: inherit

  test:
    name: tests
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  sonarqube:
    name: Gate 2 · SonarQube
    permissions:
      contents: read
    needs: [gitleaks, lint, test]
    uses: ./.github/workflows/gate-2-sonarqube.yml
    secrets: inherit

  build:
    name: build image
    permissions:
      contents: read
      packages: write
    needs: [scope, sonarqube]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  sbom-scan:
    name: Gate 3 · SBOM + Grype
    permissions:
      contents: read
      packages: write
    needs: [scope, build]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/gate-3-sbom-grype.yml
    secrets: inherit

  acs-check:
    name: Gate 4 · ACS
    permissions:
      contents: read
      packages: write
    needs: [scope, build]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/gate-4-acs.yml
    secrets: inherit

  promote-dockerhub:
    name: promote to Docker Hub
    permissions:
      contents: read
      packages: write
    needs: [scope, sbom-scan, acs-check]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/promote.yml
    secrets: inherit

  sign:
    name: cosign sign
    permissions:
      contents: read
      packages: write
    needs: [scope, promote-dockerhub]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/sign.yml
    secrets: inherit

  update-manifest:
    name: propose manifest bump
    permissions:
      contents: read
    needs: [scope, sign]
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/update-manifest.yml
    secrets: inherit

  #
  ci-summary:
    name: 📊 CI summary
    needs: [scope, test, sonarqube]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: test-results

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sonar-report-task
          path: sonar-report-task

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: acs-report-backend
          path: acs/backend

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: acs-report-frontend
          path: acs/frontend

      - name: Find the previous run for comparison
        id: previous
        continue-on-error: true
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=2&exclude_pull_requests=true"
          prev=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" "$url" \
            | jq -r '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id // empty')
          [ -n "$prev" ] && echo "run_id=$prev" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        with:
          name: ci-metrics-tests
          path: previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CI summary
        run: |
          python3 .github/scripts/generate-ci-summary.py \
            --junit "backend=test-results/backend/target/surefire-reports/TEST-*.xml" \
            --junit "frontend=test-results/frontend/junit.xml" \
            --compare-json previous/ci-metrics.json \
            --sonar-project-key opsera-mid_project \
            --sonar-ce-task-file sonar-report-task/report-task.txt \
            --acs-report "backend=acs/backend/acs-check-backend.json" \
            --acs-report "frontend=acs/frontend/acs-check-frontend.json" \
            --out-json ci-metrics.json \
            --update-readme README.md \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Add report links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN: ${{ github.run_id }}
        run: |
          artifacts=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.name) \(.id)"' 2>/dev/null || true)
          {
            echo "### 📦 Reports"
            echo ""
            if [ -n "$artifacts" ]; then
              while read -r name id; do
                [ -z "${name:-}" ] && continue
                echo "- [\`$name\`]($SERVER/$REPO/actions/runs/$RUN/artifacts/$id)"
              done <<< "$artifacts"
            else
              echo "_No artifacts were produced for this run._"
              echo ""
            fi
            echo "- [Code scanning — gitleaks and grype findings]($SERVER/$REPO/security/code-scanning)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        id: upload-ci-metrics
        if: always()
        with:
          name: ci-metrics-tests
          path: ci-metrics.json
          retention-days: 30

      - name: Commit the generated README section
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "pipeline-bot[bot]"
          git config user.email "pipeline-bot@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README already current."
            exit 0
          fi
          git add README.md
          git commit -q -m "ci: refresh the CI quality section [skip ci]"
          if ! git push; then
            echo "::error::Could not push the README update — a branch protection rule is probably blocking the bot. The generated section is in this job's summary."
          fi
