# ==============================================================================
# ci.yml
# ==============================================================================
# FUNCTION
#   The only event-triggered workflow: defines the whole 11-job DAG and calls every
#   other workflow in this directory as a reusable `workflow_call` job.
#
# ROLE IN PIPELINE
#   Pipeline entry point. Triggers on push/PR to main and orchestrates the gates.
#
# SECRETS READ
#   - GITHUB_TOKEN
#   - SONAR_HOST_URL
#   - SONAR_TOKEN
#
# REPOSITORY VARIABLES READ
#   (none)
#
# NOTES
#   Jobs run strictly in order: gitleaks/lint/test -> sonarqube -> build ->
#   sbom-scan -> acs-check -> promote -> sign -> update-manifest -> ci-summary.
#   ci-summary is terminal (needs update-manifest, if: always()) so it reports
#   the whole pipeline and still renders when an earlier gate fails.
# ==============================================================================

name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gate 0 · gitleaks
    permissions:
      contents: read
      security-events: write # the called workflow uploads SARIF to code scanning
    uses: ./.github/workflows/gate-0-gitleaks.yml
    secrets: inherit

  lint:
    name: Gate 1 · lint
    permissions:
      contents: read
    uses: ./.github/workflows/gate-1-lint.yml
    secrets: inherit

  test:
    name: tests
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  sonarqube:
    name: Gate 2 · SonarQube
    permissions:
      contents: read
    needs: [gitleaks, lint, test]
    uses: ./.github/workflows/gate-2-sonarqube.yml
    secrets: inherit

  build:
    name: build image
    permissions:
      contents: read
      packages: write
    needs: [sonarqube]
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  sbom-scan:
    name: Gate 3 · SBOM + Grype
    permissions:
      contents: read
      packages: write
      # the called workflow uploads the Grype SARIF to code scanning; without
      # this the upload fails with "Resource not accessible by integration"
      security-events: write
    needs: [build]
    if: github.event_name == 'push'
    uses: ./.github/workflows/gate-3-sbom-grype.yml
    secrets: inherit

  
  # Gate 4 runs after Gate 3 so the gates execute in numbered order and so a
  # Gate 3 failure stops the (comparatively cheap) ACS scan from running at
  # all. Gate 4 reads no artifact from Gate 3 — it does its own `roxctl image
  # check`/`scan` against GHCR — so this ordering is about fail-fast, not data.
  # The cost is that the two longest jobs can no longer overlap.
  acs-check:
    name: Gate 4 · ACS
    permissions:
      contents: read
      packages: write
    needs: [build, sbom-scan]
    if: github.event_name == 'push'
    uses: ./.github/workflows/gate-4-acs.yml
    secrets: inherit

  promote-dockerhub:
    name: promote to Docker Hub
    permissions:
      contents: read
      packages: write
    needs: [sbom-scan, acs-check]
    if: github.event_name == 'push'
    uses: ./.github/workflows/promote.yml
    secrets: inherit

  sign:
    name: cosign sign
    permissions:
      contents: read
      packages: write
    needs: [promote-dockerhub]
    if: github.event_name == 'push'
    uses: ./.github/workflows/sign.yml
    secrets: inherit

  update-manifest:
    name: propose manifest bump
    permissions:
      contents: read
    needs: [sign]
    if: github.event_name == 'push'
    uses: ./.github/workflows/update-manifest.yml
    secrets: inherit

  #
  ci-summary:
    name: 📊 CI summary
    # Terminal job: needs the end of the delivery chain, not just [test,
    # sonarqube]. `update-manifest` transitively depends on every gate
    # (gitleaks, lint, test -> sonarqube -> build -> sbom-scan -> acs-check ->
    # promote -> sign -> update-manifest), so this now waits for all of them.
    #
    # `always()` is required, not decorative: `update-manifest` is gated on
    # `github.event_name == 'push'`, so on a pull_request it is SKIPPED, and
    # any Gate 4 failure skips promote -> sign -> manifest. Without `always()`
    # the summary would be skipped in exactly the cases it exists to explain.
    needs: [update-manifest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: test-results

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sonar-report-task
          path: sonar-report-task

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: acs-report-backend
          path: acs/backend

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: acs-report-frontend
          path: acs/frontend

      - name: Find the previous run for comparison
        id: previous
        continue-on-error: true
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=2&exclude_pull_requests=true"
          prev=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" "$url" \
            | jq -r '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id // empty')
          [ -n "$prev" ] && echo "run_id=$prev" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        with:
          name: ci-metrics-tests
          path: previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CI summary
        run: |
          python3 .github/scripts/generate-ci-summary.py \
            --junit "backend=test-results/backend/target/surefire-reports/TEST-*.xml" \
            --junit "frontend=test-results/frontend/junit.xml" \
            --compare-json previous/ci-metrics.json \
            --sonar-project-key opsera-mid_project \
            --sonar-ce-task-file sonar-report-task/report-task.txt \
            --acs-report "backend=acs/backend/acs-check-backend.json" \
            --acs-report "frontend=acs/frontend/acs-check-frontend.json" \
            --out-json ci-metrics.json \
            --update-readme README.md \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Add report links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN: ${{ github.run_id }}
        run: |
          artifacts=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.name) \(.id)"' 2>/dev/null || true)
          {
            echo "### 📦 Reports"
            echo ""
            if [ -n "$artifacts" ]; then
              while read -r name id; do
                [ -z "${name:-}" ] && continue
                echo "- [\`$name\`]($SERVER/$REPO/actions/runs/$RUN/artifacts/$id)"
              done <<< "$artifacts"
            else
              echo "_No artifacts were produced for this run._"
              echo ""
            fi
            echo "- [Code scanning — gitleaks and grype findings]($SERVER/$REPO/security/code-scanning)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        id: upload-ci-metrics
        if: always()
        with:
          name: ci-metrics-tests
          path: ci-metrics.json
          retention-days: 30

      - name: Commit the generated README section
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "pipeline-bot[bot]"
          git config user.email "pipeline-bot@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README already current."
            exit 0
          fi
          git add README.md
          git commit -q -m "ci: refresh the CI quality section [skip ci]"
          if ! git push; then
            echo "::error::Could not push the README update — a branch protection rule is probably blocking the bot. The generated section is in this job's summary."
          fi
