name: gate-2-sonarqube

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalise SONAR_HOST_URL
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          CLEAN=$(printf '%s' "$SONAR_HOST_URL" | tr -d '[:space:]')
          if [ -z "$CLEAN" ]; then
            echo "::error::SONAR_HOST_URL secret is empty"
            exit 1
          fi
          echo "SONAR_HOST_URL=$CLEAN" >> "$GITHUB_ENV"
          echo "using SONAR_HOST_URL=$CLEAN"

      - name: Verify SonarQube reachability and token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/sq-status.json -w '%{http_code}' \
            --max-time 30 "$SONAR_HOST_URL/api/system/status" || true)
          if [ "$code" != "200" ]; then
            echo "::error::SonarQube is not reachable at SONAR_HOST_URL (HTTP $code)."
            echo "Tunnel providers cap bandwidth or rate limits; a dead tunnel fails here, not in the scan."
            head -c 500 /tmp/sq-status.json 2>/dev/null || true
            echo
            exit 1
          fi
          echo "SonarQube reachable: $(cat /tmp/sq-status.json)"

          vcode=$(curl -sS -o /tmp/sq-auth.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/authentication/validate" || true)
          if [ "$vcode" != "200" ] || ! grep -q '"valid":true' /tmp/sq-auth.json; then
            echo "::error::SONAR_TOKEN was rejected by SonarQube (HTTP $vcode): $(cat /tmp/sq-auth.json 2>/dev/null)"
            exit 1
          fi
          echo "SONAR_TOKEN accepted"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile backend for sonar.java.binaries
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - uses: actions/download-artifact@v4
        with:
          name: coverage-raw
          path: coverage-raw

      - name: SonarQube Scan
        id: sonarqube-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=opsera-mid_project
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-raw/backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=coverage-raw/frontend/coverage/lcov.info

      - name: Quality Gate check
        id: quality-gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -f .scannerwork ] && cp -r .scannerwork report-out/ 2>/dev/null || true
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no local report — see SonarQube dashboard"
          tar -czf sonarqube-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: sonarqube-report.tar.gz
          retention-days: 7

      # report-task.txt carries ceTaskId=..., which the ci-summary job polls
      # so the Quality Gate and measures are read after the analysis is
      # processed rather than while it is still queued.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-report-task
          path: .scannerwork/report-task.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: SonarQube results
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: opsera-mid_project
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          # SONAR_HOST_URL comes from $GITHUB_ENV, where the normalise step
          # above already stripped it. Reading the secret directly here
          # would shadow that and reintroduce the whitespace the gate
          # exists to survive.
          URL = os.environ["SONAR_HOST_URL"].strip().rstrip("/")
          TOKEN = os.environ["SONAR_TOKEN"].strip()
          KEY = os.environ["SONAR_PROJECT_KEY"]
          SUMMARY = os.environ["GITHUB_STEP_SUMMARY"]

          def get(path, params):
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{URL}{path}?{query}",
                  headers={"Authorization": f"Bearer {TOKEN}"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          def get_safe(path, params):
              # Reporting must never be the reason a green gate turns red,
              # so an unreachable or erroring API degrades to a warning.
              try:
                  return get(path, params)
              except Exception as exc:
                  print(f"::warning::{path} failed: {exc}")
                  return {}

          gate = (get_safe("/api/qualitygates/project_status",
                           {"projectKey": KEY})
                  .get("projectStatus") or {}).get("status", "UNKNOWN")

          measures = {
              m["metric"]: m.get("value")
              for m in (get_safe("/api/measures/component", {
                  "component": KEY,
                  "metricKeys": "coverage,duplicated_lines_density,ncloc,"
                                "bugs,vulnerabilities,security_hotspots,"
                                "code_smells",
              }).get("component") or {}).get("measures", [])
          }

          def value(metric, suffix=""):
              raw = measures.get(metric)
              if raw in (None, "", "N/A"):
                  return "N/A"
              return f"{raw}{suffix}"

          percent = ("coverage", "duplicated_lines_density")
          rows = [
              ("Bugs", "bugs"),
              ("Vulnerabilities", "vulnerabilities"),
              ("Code smells", "code_smells"),
              ("Security hotspots", "security_hotspots"),
              ("Coverage", "coverage"),
              ("Duplicated lines", "duplicated_lines_density"),
              ("Lines of code", "ncloc"),
          ]

          icon = "✅" if gate == "OK" else "❌"
          lines = [
              "## SonarQube results",
              "",
              f"**Quality Gate:** {icon} `{gate}`",
              "",
              "| Metric | Value |",
              "| :--- | ---: |",
          ]
          lines += [
              f"| {label} | {value(m, '%' if m in percent else '')} |"
              for label, m in rows
          ]
          lines += [
              "",
              f"[Open the SonarQube project]({URL}/dashboard?id={KEY})",
              "",
          ]

          with open(SUMMARY, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.quality-gate.outcome }}" == "success" ]; then
            echo "✅ sonarqube: Quality Gate passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ sonarqube: Quality Gate failed — see ${{ secrets.SONAR_HOST_URL }} for details" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
