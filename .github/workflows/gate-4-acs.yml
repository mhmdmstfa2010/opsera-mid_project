# ==============================================================================
# gate-4-acs.yml
# ==============================================================================
# FUNCTION
#   Runs the RHACS Central policy check and image scan against the staged image
#   using roxctl, failing the job on any policy violation.
#
# ROLE IN PIPELINE
#   Gate 4 - RHACS policy compliance.
#
# SECRETS READ
#   - ROX_API_TOKEN
#   - ROX_CENTRAL_ENDPOINT
#
# REPOSITORY VARIABLES READ
#   (none)
#
# NOTES
#   roxctl is installed from a pinned URL (4.11.4) and authenticates with
#   ROX_API_TOKEN via environment variables. This job consumes no artifact from
#   Gate 3: it scans the GHCR image independently, which is why sequencing it
#   after Gate 3 is a fail-fast optimisation rather than a data dependency.
# ==============================================================================

name: gate-4-acs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  acs-check:
    name: Gate 4 · ACS (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: roxctl setup
        id: roxctl-setup
        continue-on-error: true
        run: |
          curl -sSL -o roxctl "https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl"
          chmod +x roxctl
          ./roxctl version

      - name: ACS image check
        id: acs-check
        if: steps.roxctl-setup.outcome == 'success'
        continue-on-error: true
        env:
          ROX_ENDPOINT: ${{ secrets.ROX_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
          ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY: "true"
        run: |
          set +e
          ./roxctl image check \
            --image="$GHCR_IMAGE" \
            --output json > acs-check-${{ matrix.component }}.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "roxctl check exited $code"

      - name: ACS image scan
        id: acs-scan
        if: steps.roxctl-setup.outcome == 'success'
        continue-on-error: true
        env:
          ROX_ENDPOINT: ${{ secrets.ROX_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
          ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY: "true"
        run: |
          set +e
          ./roxctl image scan \
            --image="$GHCR_IMAGE" \
            --output json > acs-scan-${{ matrix.component }}.json
          echo "scan exited $?"
          set -e

      - name: Report the policy violations
        id: violations
        if: always()
        env:
          REPORT: acs-check-${{ matrix.component }}.json
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ env.GHCR_IMAGE }}
          EXIT_CODE: ${{ steps.acs-check.outputs.exit_code }}
        run: |
          {
            echo "## RHACS image check"
            echo ""
            echo "**$COMPONENT** · \`$IMAGE\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$REPORT" ]; then
            {
              echo "_No report was produced. roxctl exit code: \`${EXIT_CODE:-n/a}\`_"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::no ACS report at $REPORT"
            exit 0
          fi

          table=$(jq -r '
            def name_of: (.policy // .policyName // .name // .title
                          // (if .policyId then "policy " + .policyId else null end)
                          // "unknown policy");
            def msg_of($v): ($v.message // $v.title // $v.cve // $v
                             | tostring);

            ( [ .reports[]?.scan.results.policyViolations[]? ]
              + [ .reports[]?.scan.summary.policyViolations[]? ]
              + [ .reports[]?.results.policyViolations[]? ]
              + [ .policyViolations[]? ] )
              as $direct
              | ( if ($direct | length) > 0 then $direct
                else [ .. | objects | select(has("violations")) ] end )
              | [ .[] | ( .violations // [] )[] as $v
                  | { policy: name_of, sev: ( ($v.severity // .severity // "—")
                                              | tostring ),
                      message: msg_of($v) } ]
              | ( if length == 0 then "NONE"
                  else (.[0:8]
                        | map("| " + (.policy | gsub("[|]"; "&#124;"))
                                + " | " + (.sev | gsub("[|]"; "&#124;"))
                                + " | " + ((.message | gsub("[|]"; "&#124;"))[0:120])
                                + " |")
                        | join("\n")),
                        (if length > 8 then "MORE\t" + ((length - 8) | tostring) else empty end)
                  end )
                    ' "$REPORT" 2>/dev/null) || table="PARSE_ERROR"

          count=$(jq -r '
            ( [ .reports[]?.scan.results.policyViolations[]? ]
              + [ .reports[]?.scan.summary.policyViolations[]? ]
              + [ .reports[]?.results.policyViolations[]? ]
              + [ .policyViolations[]? ] )
              as $direct
            | ( if ($direct | length) > 0 then $direct
                else [ .. | objects | select(has("violations")) ] end )
            | [ .[] | ( .violations // [] )[] ] | length
          ' "$REPORT" 2>/dev/null) || count=""

          case "$table" in
            NONE)      count=0 ;;
            PARSE_ERROR) count="" ;;
            *)         [ -n "$count" ] || count=8 ;;
          esac

          echo "violations=${count}" >> "$GITHUB_OUTPUT"

          echo "roxctl exit code: ${EXIT_CODE:-n/a}"
          echo "$table" | head -20

          if [ "${EXIT_CODE}" != "0" ] && { [ "$table" = "NONE" ] || [ "$table" = "PARSE_ERROR" ]; }; then
            {
              echo "### ⚠️ Scan failed, but no violations could be read from the report"
              echo ""
              echo "roxctl exited \`${EXIT_CODE}\`, so this **is** a failure — the report"
              echo "just did not parse into a violations list. Structure of \`$REPORT\`:"
              echo ""
              echo '```'
              jq -r 'if type == "object" then
                       ( "top-level keys: " + (keys | join(", ")) ), "",
                       ( [ paths(scalars) as $p
                           | ($p | map(tostring) | join(".")) as $path
                           | select($path | test("violation|policy|error|fail"; "i"))
                           | "  " + $path + " = " + (getpath($p) | tostring)[0:80] ]
                         | .[0:25] | join("\n") )
                     else "not an object: " + type end' "$REPORT" 2>/dev/null | head -30
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          case "$table" in
            NONE)
              {
                if [ "${EXIT_CODE}" = "0" ]; then
                  echo "### 🟢 No policy violations"
                else
                  echo "### ❌ No violations could be extracted (see the structure above)"
                fi
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            PARSE_ERROR)
              {
                echo "### ⚠️ The report could not be parsed"
                echo ""
                echo "See the \`acs-report-$COMPONENT\` artifact for the raw JSON."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::could not parse $REPORT with jq"
              ;;
            *)
              {
                echo "### ❌ Policy violations"
                echo ""
                echo "| Policy | Severity | Violation |"
                echo "| :--- | :--- | :--- |"
                echo "$table" | grep -v '^MORE' || true
                echo ""
                echo "$table" | grep '^MORE' | sed 's/^MORE\t/…and /' | sed 's/$/ more — see the full `acs-report-'"$COMPONENT"'` artifact./' || true
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Report the vulnerability scan
        if: always() && steps.acs-scan.outcome == 'success'
        env:
          REPORT: acs-scan-${{ matrix.component }}.json
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "## RHACS vulnerability scan"
            echo ""
            echo "**$COMPONENT** — full CVE report, informational"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$REPORT" ]; then
            echo "_No scan report produced._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          summary=$(jq -r '
            (.result.summary // .summary // {}) as $s
            | "Critical: \($s.CRITICAL // 0) · Important: \($s.IMPORTANT // 0) · Moderate: \($s.MODERATE // 0) · Low: \($s.LOW // 0) · Components: \($s["TOTAL-COMPONENTS"] // "—") · Total CVEs: \($s["TOTAL-VULNERABILITIES"] // "—")"
          ' "$REPORT" 2>/dev/null) || summary="(could not read summary — see raw artifact)"

          echo "**$summary**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          table=$(jq -r '
            [ (.result.vulnerabilities // .vulnerabilities // [])[]
              | select(.cveSeverity == "CRITICAL" or .cveSeverity == "IMPORTANT") ]
            | sort_by(.cveSeverity) | .[0:10]
            | if length == 0 then "NONE" else
                map("| " + .cveId + " | " + .cveSeverity + " | " + .componentName
                    + " | " + .componentVersion + " | " + (.componentFixedVersion // "—") + " |")
                | join("\n")
              end
          ' "$REPORT" 2>/dev/null) || table="PARSE_ERROR"

          if [ "$table" != "NONE" ] && [ "$table" != "PARSE_ERROR" ]; then
            {
              echo "| CVE | Severity | Component | Version | Fixed in |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              echo "$table"
              echo ""
              echo "_Showing up to 10 Critical/Important CVEs — full list in the acs-report-$COMPONENT artifact._"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$table" = "NONE" ]; then
            echo "_No Critical/Important CVEs found._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Could not parse the scan report — see the raw artifact._" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -f acs-check-${{ matrix.component }}.json ] && cp acs-check-${{ matrix.component }}.json report-out/
          [ -f acs-scan-${{ matrix.component }}.json ] && cp acs-scan-${{ matrix.component }}.json report-out/
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf acs-report-${{ matrix.component }}.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        id: upload-acs-report
        if: always()
        with:
          name: acs-report-${{ matrix.component }}
          path: acs-report-${{ matrix.component }}.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        env:
          EXIT_CODE: ${{ steps.acs-check.outputs.exit_code }}
          VIOLATIONS: ${{ steps.violations.outputs.violations }}
        run: |
          if [ "${{ steps.roxctl-setup.outcome }}" != "success" ]; then
            echo "❌ Gate 4 ACS (${{ matrix.component }}): failed — roxctl could not be downloaded" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "❌ Gate 4 ACS (${{ matrix.component }}): failed — roxctl exit \`${EXIT_CODE:-n/a}\`; details above" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$VIOLATIONS" ] && [ "$VIOLATIONS" != "0" ]; then
            echo "❌ Gate 4 ACS (${{ matrix.component }}): failed — roxctl exited 0 but the report contains \`${VIOLATIONS}\` policy violation(s); the policy is not enforcing, or it is set to audit-only" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Gate 4 ACS (${{ matrix.component }}): passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "${{ steps.upload-acs-report.outputs.artifact-url }}" ] && \
            echo "[📄 ACS report](${{ steps.upload-acs-report.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          exit 0