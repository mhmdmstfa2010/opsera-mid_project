name: gate-4-acs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  acs-check:
    name: Gate 4 · ACS (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: roxctl setup
        id: roxctl-setup
        continue-on-error: true
        run: |
          curl -sSL -o roxctl "https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl"
          chmod +x roxctl
          ./roxctl version

      - name: ACS image check
        id: acs-check
        if: steps.roxctl-setup.outcome == 'success'
        continue-on-error: true
        env:
          ROX_ENDPOINT: ${{ secrets.ROX_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
          ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY: "true"
        run: |
          ./roxctl image check \
            --image="$GHCR_IMAGE" \
            --output json > acs-check-${{ matrix.component }}.json || true

      # roxctl redirects everything into the JSON file, so without this the
      # only trace of a policy violation is "exit code 1". Surface the
      # violated policy names in the job summary.
      - name: Report the policy violations
        if: always()
        env:
          REPORT: acs-check-${{ matrix.component }}.json
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          python3 - <<'PY'
          import json, os
          report = os.environ["REPORT"]
          component = os.environ["COMPONENT"]
          image = os.environ["IMAGE"]
          try:
              with open(report, encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception as exc:
              print(f"::warning::could not read {report}: {exc}")
              raise SystemExit(0)

          def walk(node, path=()):
              if isinstance(node, dict):
                  for key, value in node.items():
                      yield from walk(value, path + (key,))
              elif isinstance(node, list):
                  for item in node:
                      yield from walk(item, path)
              else:
                  yield path, node

          reports = data.get("reports") or [data]
          lines = ["## RHACS image check", "", f"**{component}** · `{image}`", ""]
          violations = []

          for entry in reports:
              scan = entry.get("scan", entry)
              summary = scan.get("summary") or {}
              for policy in summary.get("policyViolations") or []:
                  violations.append({
                      "policy": policy.get("policy") or "?",
                      "id": policy.get("policyId", ""),
                      "count": len(policy.get("violations") or []),
                  })
              results = scan.get("results") or {}
              for name, value in results.items():
                  if name == "policyViolations":
                      continue
              if not violations and summary.get("policyViolationCount"):
                  violations.append({"policy": "see acs-check json",
                                      "id": "", "count": summary["policyViolationCount"]})

          if violations:
              lines += ["### ❌ Policy violations", "",
                        "| Policy | Violations |", "| :--- | ---: |"]
              for item in violations:
                  lines.append(f"| {item['policy']} | {item['count']} |")
          else:
              lines += ["### 🟢 No policy violations", ""]

          counts = {k: v for k, v in ((scan.get("summary") or {}).items())
                    if isinstance(v, int) and not k.endswith("Count")}
          if counts:
              lines += ["| Scan metric | Count |", "| :--- | ---: |"]
              for key, value in sorted(counts.items()):
                  lines.append(f"| {key} | {value} |")
              lines.append("")

          text = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(text)
          print(text)
          PY

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -f acs-check-${{ matrix.component }}.json ] && cp acs-check-${{ matrix.component }}.json report-out/
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf acs-report-${{ matrix.component }}.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acs-report-${{ matrix.component }}
          path: acs-report-${{ matrix.component }}.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.acs-check.outcome }}" == "success" ]; then
            echo "✅ Gate 4 ACS (${{ matrix.component }}): passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see acs-report-${{ matrix.component }} artifact and job log"
            [ "${{ steps.roxctl-setup.outcome }}" != "success" ] && REASON="could not download roxctl"
            [ "${{ steps.acs-check.outcome }}" != "success" ] && [ "${{ steps.roxctl-setup.outcome }}" == "success" ] && REASON="ACS policy violation"
            echo "❌ Gate 4 ACS (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
