name: gate-1-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — backend Dockerfile
        id: hadolint-backend
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-backend.json
          format: json

      - name: Hadolint — frontend Dockerfile
        id: hadolint-frontend
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          output-file: hadolint-frontend.json
          format: json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Backend lint (checkstyle)
        id: lint-backend
        continue-on-error: true
        working-directory: backend
        run: |
          ./mvnw -B checkstyle:check | tee ../checkstyle-backend.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint (eslint)
        id: lint-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --format json --output-file ../eslint-frontend.json

      - name: Archive lint reports
        if: always()
        run: |
          mkdir -p report-out
          for f in hadolint-backend.json hadolint-frontend.json checkstyle-backend.log eslint-frontend.json; do
            [ -f "$f" ] && cp "$f" report-out/
          done
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf lint-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        id: upload-lint-report
        if: always()
        with:
          name: lint-report
          path: lint-report.tar.gz
          retention-days: 7

      # SHORT summary: verdict plus a link. The full roll-up is in the
      # "📊 CI summary" aggregator job.
      - name: Pass/fail message
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload-lint-report.outputs.artifact-url }}
        run: |
          FAILED=()
          [ "${{ steps.hadolint-backend.outcome }}" != "success" ] && FAILED+=("hadolint-backend")
          [ "${{ steps.hadolint-frontend.outcome }}" != "success" ] && FAILED+=("hadolint-frontend")
          [ "${{ steps.lint-backend.outcome }}" != "success" ] && FAILED+=("checkstyle-backend")
          [ "${{ steps.lint-frontend.outcome }}" != "success" ] && FAILED+=("eslint-frontend")
          if [ ${#FAILED[@]} -eq 0 ]; then
            echo "✅ lint: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ lint: failed —${FAILED[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            RC=1
          fi
          {
            [ -n "$ARTIFACT_URL" ] && echo "[📄 Lint report]($ARTIFACT_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${RC:-0}"
