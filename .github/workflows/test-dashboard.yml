name: results-dashboard

on:
  workflow_call:
    inputs:
      project-key:
        description: SonarQube project key the analysis gate used
        type: string
        default: opsera-mid_project
      stage-results:
        description: JSON of every job the orchestrator waited on (toJSON(needs))
        type: string
        default: '{}'

permissions:
  contents: read
  actions: read

jobs:
  dashboard:
    name: 📊 results dashboard
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PROJECT_KEY: ${{ inputs.project-key }}
      SONAR_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      STAGE_RESULTS: ${{ inputs.stage-results }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GH_WORKFLOW: ci.yml
      RUN_ID: ${{ github.run_id }}
      PREVIOUS_RUNS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-raw
          path: coverage-raw

      - name: Build dashboard
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
        run: python3 ./.ci/dashboard.py

      - name: Publish dashboard
        if: always()
        run: |
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "Dashboard published to the run summary."
          else
            echo "::warning::dashboard produced no output — coverage artifacts missing?"
          fi
