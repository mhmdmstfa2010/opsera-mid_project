
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  GRYPE_SEVERITY_THRESHOLD: high
permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # Gate 0 — Secrets scan (whole repo, both components)
  # ============================================================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not a shallow clone

      - id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # so we can report/archive before failing the job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_FORMAT: json
          GITLEAKS_REPORT_PATH: gitleaks-report.json

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          if [ -f gitleaks-report.json ]; then
            cp gitleaks-report.json report-out/
          else
            echo "no report produced" > report-out/NO_REPORT.txt
          fi
          tar -czf gitleaks-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "success" ]; then
            echo "✅ gitleaks: passed, no secrets detected" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON=$(jq -r '.[0].RuleID // "see gitleaks-report artifact"' gitleaks-report.json 2>/dev/null || echo "see gitleaks-report artifact")
            echo "❌ gitleaks: failed — secret pattern matched ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 1 — Lint (backend: checkstyle, frontend: eslint)
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — backend Dockerfile
        id: hadolint-backend
        continue-on-error: true
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-backend.json
          format: json

      - name: Hadolint — frontend Dockerfile
        id: hadolint-frontend
        continue-on-error: true
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: frontend/Dockerfile
          output-file: hadolint-frontend.json
          format: json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # TODO(validate): match your actual Java version from pom.xml

      - name: Backend lint (checkstyle)
        id: lint-backend
        continue-on-error: true
        working-directory: backend
        run: |
          # TODO(validate): confirm the checkstyle plugin is bound in pom.xml;
          # if not present, replace with your actual lint target (spotbugs, pmd, etc.)
          ./mvnw -B checkstyle:check | tee ../checkstyle-backend.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # TODO(validate): match your actual Node version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint (eslint)
        id: lint-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # TODO(validate): confirm a "lint" script exists in package.json
          npm run lint -- --format json --output-file ../eslint-frontend.json

      - name: Archive lint reports
        if: always()
        run: |
          mkdir -p report-out
          for f in hadolint-backend.json hadolint-frontend.json checkstyle-backend.log eslint-frontend.json; do
            [ -f "$f" ] && cp "$f" report-out/
          done
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf lint-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: lint-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.hadolint-backend.outcome }}" != "success" ] && FAILED="$FAILED hadolint-backend"
          [ "${{ steps.hadolint-frontend.outcome }}" != "success" ] && FAILED="$FAILED hadolint-frontend"
          [ "${{ steps.lint-backend.outcome }}" != "success" ] && FAILED="$FAILED checkstyle-backend"
          [ "${{ steps.lint-frontend.outcome }}" != "success" ] && FAILED="$FAILED eslint-frontend"
          if [ -z "$FAILED" ]; then
            echo "✅ lint: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ lint: failed —$FAILED (see lint-report artifact)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Parallel with gitleaks + lint — Test + coverage (backend + frontend)
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # TODO(validate)

      - name: Backend tests + JaCoCo coverage
        id: test-backend
        continue-on-error: true
        working-directory: backend
        run: |
          # TODO(validate): confirm jacoco-maven-plugin is bound to the
          # `test` phase in pom.xml; if not, add it or coverage will be empty
          ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # TODO(validate)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests + coverage
        id: test-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # --passWithNoTests: this repo currently has no frontend test
          # files, and Jest exits 1 on "No tests found" which failed the
          # whole test job. Coverage still lands in coverage/lcov.info
          # (Jest default) whenever tests do exist.
          npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Archive coverage + test reports
        if: always()
        run: |
          mkdir -p report-out/backend report-out/frontend
          [ -d backend/target/site/jacoco ] && cp -r backend/target/site/jacoco report-out/backend/
          [ -d backend/target/surefire-reports ] && cp -r backend/target/surefire-reports report-out/backend/
          [ -d frontend/coverage ] && cp -r frontend/coverage report-out/frontend/
          tar -czf test-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.tar.gz
          retention-days: 7

      # Separate, untarred artifact for SonarQube to consume directly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-raw
          path: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          retention-days: 1

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.test-backend.outcome }}" == "success" ] && [ "${{ steps.test-frontend.outcome }}" == "success" ]; then
            echo "✅ test: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            FAILED=""
            [ "${{ steps.test-backend.outcome }}" != "success" ] && FAILED="$FAILED backend"
            [ "${{ steps.test-frontend.outcome }}" != "success" ] && FAILED="$FAILED frontend"
            echo "❌ test: failed —$FAILED (see test-report artifact)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 2 — SonarQube (after gitleaks + lint + test)
  # ============================================================
  sonarqube:
    runs-on: ubuntu-latest
    needs: [gitleaks, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # sonar.java.binaries points at backend/target/classes — this job runs
      # on a fresh VM, so the classes have to be compiled here (test job's
      # VM is long gone by now).
      - name: Compile backend for sonar.java.binaries
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - uses: actions/download-artifact@v4
        with:
          name: coverage-raw
          path: coverage-raw

      - name: SonarQube Scan
        id: sonarqube-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=opsera-mid_project
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-raw/backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=coverage-raw/frontend/coverage/lcov.info

      - name: Quality Gate check
        id: quality-gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -d .scannerwork ] && cp -r .scannerwork report-out/ 2>/dev/null || true
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no local report — see SonarQube dashboard" > report-out/NO_REPORT.txt
          tar -czf sonarqube-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: sonarqube-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.quality-gate.outcome }}" == "success" ]; then
            echo "✅ sonarqube: Quality Gate passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ sonarqube: Quality Gate failed — see ${{ secrets.SONAR_HOST_URL }} for details" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Build -> SBOM -> Grype -> push to GHCR (staging) -> ACS gate ->
  # promote to Quay -> sign. All in ONE job per component, because
  # each GitHub Actions job runs on a fresh VM — a local image built
  # in one job does not exist in the next job, so everything that
  # needs that same local image has to stay in the same job.
  # ============================================================
  build-scan-push-sign:
    runs-on: ubuntu-latest
    needs: [sonarqube]
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      backend_image: ${{ steps.set-output.outputs.backend_image }}
      frontend_image: ${{ steps.set-output.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      # ---- Build (local only) ----
      - name: Build image
        id: build
        continue-on-error: true
        run: docker build -t ${{ matrix.component }}:${{ github.sha }} ./${{ matrix.component }}

      # ---- SBOM ----
      - name: Generate SBOM (syft)
        id: syft
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.component }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.json

      # ---- Gate 4: Grype on the local SBOM, no registry involved ----
      # ACS/roxctl needs a registry reference to scan — it queries the
      # registry for image metadata rather than reading local layers, so a
      # true registry-free pre-push scan has to use Grype here instead.
      - name: Scan SBOM with Grype
        id: grype
        if: steps.syft.outcome == 'success'
        continue-on-error: true
        uses: anchore/scan-action@v4
        with:
          sbom: sbom-${{ matrix.component }}.json
          fail-build: true
          severity-cutoff: ${{ env.GRYPE_SEVERITY_THRESHOLD }}
          output-format: json

      # ---- Push to GHCR (staging registry, so ACS has something to query) ----
      - name: Log in to GHCR
        id: ghcr-login
        if: steps.grype.outcome == 'success'
        continue-on-error: true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        id: push-ghcr
        if: steps.ghcr-login.outcome == 'success'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}"
          docker tag ${{ matrix.component }}:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "ghcr_image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ---- Gate 5: ACS policy check against the staged GHCR image ----
      # Prerequisite: a GHCR Image Integration must already be configured
      # in ACS Central, or this fails with "no matching image registries found".
      - name: roxctl setup
        id: roxctl-setup
        if: steps.push-ghcr.outcome == 'success'
        continue-on-error: true
        run: |
          curl -sSL -o roxctl "https://mirror.openshift.com/pub/rhacs/assets/latest/bin/Linux/roxctl"
          chmod +x roxctl

      - name: ACS image check (Gate 5)
        id: acs-check
        if: steps.roxctl-setup.outcome == 'success'
        continue-on-error: true
        run: |
          ./roxctl image check \
            --image="${{ steps.push-ghcr.outputs.ghcr_image }}" \
            --endpoint "${{ secrets.ROX_CENTRAL_ENDPOINT }}" \
            --token "${{ secrets.ROX_API_TOKEN }}" \
            --insecure-skip-tls-verify \
            --output json > acs-check-${{ matrix.component }}.json

      # ---- Promote to Docker Hub: exact bytes that passed every gate, no rebuild ----
      # Docker Hub replaces Quay for this project (mentor-approved scope
      # deviation — Quay was the registry named in the original brief).
      - name: Promote to Docker Hub (skopeo)
        id: promote-dockerhub
        if: steps.acs-check.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm quay.io/skopeo/stable copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            "docker://${{ steps.push-ghcr.outputs.ghcr_image }}" \
            "docker://docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}"
          echo "final_image=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # Note: the skopeo CLI image itself is pulled from quay.io/skopeo/stable
        # purely as a tool container — this is unrelated to where we store
        # our own application images, which is Docker Hub per the decision above.

      # ---- Gate 6: Docker Scout CVE scan ----
      # Unlike Quay, Docker Hub does not scan pushed images automatically
      # on a free/personal plan, so this has to be an explicit step here
      # rather than something that "just happens" after the push.
      - name: Install Docker Scout
        id: scout-setup
        if: steps.promote-dockerhub.outcome == 'success'
        continue-on-error: true
        run: curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Gate 6 — Docker Scout CVE scan
        id: scout-scan
        if: steps.scout-setup.outcome == 'success'
        continue-on-error: true
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker scout cves "${{ steps.promote-dockerhub.outputs.final_image }}" \
            --exit-code --only-severity critical,high \
            --output scout-${{ matrix.component }}.json --format sarif

      # ---- Sign the promoted image + attach the SBOM as an attestation ----
      - name: Install cosign
        id: cosign-setup
        if: steps.scout-scan.outcome == 'success'
        continue-on-error: true
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM
        id: sign
        if: steps.cosign-setup.outcome == 'success'
        continue-on-error: true
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --yes "${{ steps.promote-dockerhub.outputs.final_image }}" \
            --registry-creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}"
          cosign attach sbom --sbom sbom-${{ matrix.component }}.json \
            "${{ steps.promote-dockerhub.outputs.final_image }}"
          rm -f cosign.key

      - name: Set job output (final image ref)
        id: set-output
        if: always()
        run: |
          echo "${{ matrix.component }}_image=${{ steps.promote-dockerhub.outputs.final_image }}" >> "$GITHUB_OUTPUT"

      # ---- Archive everything this job produced ----
      - name: Archive reports
        if: always()
        run: |
          mkdir -p report-out
          for f in sbom-${{ matrix.component }}.json acs-check-${{ matrix.component }}.json scout-${{ matrix.component }}.json; do
            [ -f "$f" ] && cp "$f" report-out/
          done
          find . -maxdepth 1 -iname "*grype*.json" -exec cp {} report-out/ \; 2>/dev/null || true
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf build-scan-push-sign-${{ matrix.component }}-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-scan-push-sign-${{ matrix.component }}-report
          path: build-scan-push-sign-${{ matrix.component }}-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.sign.outcome }}" == "success" ]; then
            echo "✅ build-scan-push-sign (${{ matrix.component }}): passed — signed image at ${{ steps.promote-dockerhub.outputs.final_image }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # walk forward through the chain to name the first real failure
            REASON="see build-scan-push-sign-${{ matrix.component }}-report artifact and job log for the failing step"
            [ "${{ steps.build.outcome }}" != "success" ] && REASON="docker build failed"
            [ "${{ steps.syft.outcome }}" != "success" ] && [ "${{ steps.build.outcome }}" == "success" ] && REASON="SBOM generation failed"
            [ "${{ steps.grype.outcome }}" != "success" ] && [ "${{ steps.syft.outcome }}" == "success" ] && REASON="vulnerabilities at or above ${{ env.GRYPE_SEVERITY_THRESHOLD }} found"
            [ "${{ steps.push-ghcr.outcome }}" != "success" ] && [ "${{ steps.grype.outcome }}" == "success" ] && REASON="GHCR push failed"
            [ "${{ steps.acs-check.outcome }}" != "success" ] && [ "${{ steps.push-ghcr.outcome }}" == "success" ] && REASON="ACS policy violation"
            [ "${{ steps.promote-dockerhub.outcome }}" != "success" ] && [ "${{ steps.acs-check.outcome }}" == "success" ] && REASON="Docker Hub promotion failed"
            [ "${{ steps.scout-scan.outcome }}" != "success" ] && [ "${{ steps.promote-dockerhub.outcome }}" == "success" ] && REASON="Docker Scout found CRITICAL/HIGH CVEs"
            [ "${{ steps.sign.outcome }}" != "success" ] && [ "${{ steps.scout-scan.outcome }}" == "success" ] && REASON="cosign signing failed"
            echo "❌ build-scan-push-sign (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Update the separate GitOps manifest repo with the new, signed
  # image tags. ArgoCD watches that repo and syncs the cluster —
  # this job never touches the OpenShift cluster directly.
  # ============================================================
  update-manifest:
    runs-on: ubuntu-latest
    needs: [build-scan-push-sign]
    steps:
      - name: Clone manifest repo
        id: clone
        continue-on-error: true
        run: |
          git clone "https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/${{ vars.MANIFEST_REPO }}.git" manifests
          cd manifests
          git config user.email "pipeline-bot@ci"
          git config user.name "pipeline-bot"

      - name: Bump image tags
        id: bump
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        working-directory: manifests
        run: |
          # TODO(validate): adjust paths/keys to match your actual kustomize
          # or plain-YAML layout — this assumes a kustomization.yaml per
          # component under overlays/production/
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" overlays/production/backend/kustomization.yaml
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" overlays/production/frontend/kustomization.yaml
          git commit -am "bump backend+frontend to ${{ github.sha }}" || echo "nothing to commit"

      - name: Push manifest repo
        id: push-manifest
        if: steps.bump.outcome == 'success'
        continue-on-error: true
        working-directory: manifests
        run: git push

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.push-manifest.outcome }}" == "success" ]; then
            echo "✅ update-manifest: passed — ArgoCD will sync commit ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see job log"
            [ "${{ steps.clone.outcome }}" != "success" ] && REASON="could not clone manifest repo — check MANIFEST_REPO_TOKEN"
            [ "${{ steps.bump.outcome }}" != "success" ] && [ "${{ steps.clone.outcome }}" == "success" ] && REASON="failed to update kustomization.yaml — check paths"
            [ "${{ steps.push-manifest.outcome }}" != "success" ] && [ "${{ steps.bump.outcome }}" == "success" ] && REASON="git push rejected — check branch protection/token scope"
            echo "❌ update-manifest: failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi