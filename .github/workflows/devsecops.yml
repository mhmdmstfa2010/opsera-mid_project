
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  GRYPE_SEVERITY_THRESHOLD: high
permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # Gate 0 — Secrets scan (whole repo, both components)
  # ============================================================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not a shallow clone

      - id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # so we can report/archive before failing the job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_FORMAT: json
          GITLEAKS_REPORT_PATH: gitleaks-report.json

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          if [ -f gitleaks-report.json ]; then
            cp gitleaks-report.json report-out/
          else
            echo "no report produced" > report-out/NO_REPORT.txt
          fi
          tar -czf gitleaks-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "success" ]; then
            echo "✅ gitleaks: passed, no secrets detected" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON=$(jq -r '.[0].RuleID // "see gitleaks-report artifact"' gitleaks-report.json 2>/dev/null || echo "see gitleaks-report artifact")
            echo "❌ gitleaks: failed — secret pattern matched ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 1 — Lint (backend: checkstyle, frontend: eslint)
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — backend Dockerfile
        id: hadolint-backend
        continue-on-error: true
        # NOTE: this repo publishes only exact tags (v3.0.0 … v3.5.0) —
        # there is no floating v3 tag, so @v3 fails at job setup.
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-backend.json
          format: json

      - name: Hadolint — frontend Dockerfile
        id: hadolint-frontend
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          output-file: hadolint-frontend.json
          format: json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # TODO(validate): match your actual Java version from pom.xml

      - name: Backend lint (checkstyle)
        id: lint-backend
        continue-on-error: true
        working-directory: backend
        run: |
          # TODO(validate): confirm the checkstyle plugin is bound in pom.xml;
          # if not present, replace with your actual lint target (spotbugs, pmd, etc.)
          ./mvnw -B checkstyle:check | tee ../checkstyle-backend.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # TODO(validate): match your actual Node version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint (eslint)
        id: lint-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # TODO(validate): confirm a "lint" script exists in package.json
          npm run lint -- --format json --output-file ../eslint-frontend.json

      - name: Archive lint reports
        if: always()
        run: |
          mkdir -p report-out
          for f in hadolint-backend.json hadolint-frontend.json checkstyle-backend.log eslint-frontend.json; do
            [ -f "$f" ] && cp "$f" report-out/
          done
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf lint-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: lint-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.hadolint-backend.outcome }}" != "success" ] && FAILED="$FAILED hadolint-backend"
          [ "${{ steps.hadolint-frontend.outcome }}" != "success" ] && FAILED="$FAILED hadolint-frontend"
          [ "${{ steps.lint-backend.outcome }}" != "success" ] && FAILED="$FAILED checkstyle-backend"
          [ "${{ steps.lint-frontend.outcome }}" != "success" ] && FAILED="$FAILED eslint-frontend"
          if [ -z "$FAILED" ]; then
            echo "✅ lint: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ lint: failed —$FAILED (see lint-report artifact)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Parallel with gitleaks + lint — Test + coverage (backend + frontend)
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # TODO(validate)

      - name: Backend tests + JaCoCo coverage
        id: test-backend
        continue-on-error: true
        working-directory: backend
        run: |
          # TODO(validate): confirm jacoco-maven-plugin is bound to the
          # `test` phase in pom.xml; if not, add it or coverage will be empty
          ./mvnw -B test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # TODO(validate)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests + coverage
        id: test-frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # --passWithNoTests: this repo currently has no frontend test
          # files, and Jest exits 1 on "No tests found" which failed the
          # whole test job. Coverage still lands in coverage/lcov.info
          # (Jest default) whenever tests do exist.
          npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Archive coverage + test reports
        if: always()
        run: |
          mkdir -p report-out/backend report-out/frontend
          [ -d backend/target/site/jacoco ] && cp -r backend/target/site/jacoco report-out/backend/
          [ -d backend/target/surefire-reports ] && cp -r backend/target/surefire-reports report-out/backend/
          [ -d frontend/coverage ] && cp -r frontend/coverage report-out/frontend/
          tar -czf test-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.tar.gz
          retention-days: 7

      # Separate, untarred artifact for SonarQube to consume directly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-raw
          path: |
            backend/target/site/jacoco/jacoco.xml
            frontend/coverage/lcov.info
          retention-days: 1

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.test-backend.outcome }}" == "success" ] && [ "${{ steps.test-frontend.outcome }}" == "success" ]; then
            echo "✅ test: passed (backend + frontend)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            FAILED=""
            [ "${{ steps.test-backend.outcome }}" != "success" ] && FAILED="$FAILED backend"
            [ "${{ steps.test-frontend.outcome }}" != "success" ] && FAILED="$FAILED frontend"
            echo "❌ test: failed —$FAILED (see test-report artifact)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 2 — SonarQube (after gitleaks + lint + test)
  # ============================================================
  sonarqube:
    runs-on: ubuntu-latest
    needs: [gitleaks, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets pasted into GitHub can carry stray leading/trailing
      # whitespace. The scanner tolerates it, but the quality-gate
      # action builds a URL with curl and dies with
      # "curl: (3) URL rejected: Malformed input to a URL function".
      # Strip all whitespace once, here, and let later steps inherit it.
      - name: Normalise SONAR_HOST_URL
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          CLEAN=$(printf '%s' "$SONAR_HOST_URL" | tr -d '[:space:]')
          if [ -z "$CLEAN" ]; then
            echo "::error::SONAR_HOST_URL secret is empty"
            exit 1
          fi
          echo "SONAR_HOST_URL=$CLEAN" >> "$GITHUB_ENV"
          echo "using SONAR_HOST_URL=$CLEAN"

      # Fail fast and loudly if the tunnel or the token is the problem.
      # Without this, an unreachable tunnel (e.g. a tunnel provider's
      # bandwidth/rate limit) returns HTTP 403, and sonar-scanner reports
      # "You're not authorized to analyze this project" — which looks
      # exactly like a bad token and sends debugging in the wrong direction.
      - name: Verify SonarQube reachability and token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/sq-status.json -w '%{http_code}' \
            --max-time 30 "$SONAR_HOST_URL/api/system/status" || true)
          if [ "$code" != "200" ]; then
            echo "::error::SonarQube is not reachable at SONAR_HOST_URL (HTTP $code)."
            echo "Tunnel providers cap bandwidth/rate limits; a dead tunnel fails here, not in the scan."
            head -c 500 /tmp/sq-status.json 2>/dev/null || true
            echo
            exit 1
          fi
          echo "SonarQube reachable: $(cat /tmp/sq-status.json)"

          vcode=$(curl -sS -o /tmp/sq-auth.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/authentication/validate" || true)
          if [ "$vcode" != "200" ] || ! grep -q '"valid":true' /tmp/sq-auth.json; then
            echo "::error::SONAR_TOKEN was rejected by SonarQube (HTTP $vcode): $(cat /tmp/sq-auth.json 2>/dev/null)"
            exit 1
          fi
          echo "SONAR_TOKEN accepted"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # sonar.java.binaries points at backend/target/classes — this job runs
      # on a fresh VM, so the classes have to be compiled here (test job's
      # VM is long gone by now).
      - name: Compile backend for sonar.java.binaries
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - uses: actions/download-artifact@v4
        with:
          name: coverage-raw
          path: coverage-raw

      - name: SonarQube Scan
        id: sonarqube-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          # SONAR_TOKEN only — SONAR_HOST_URL comes from $GITHUB_ENV
          # (already whitespace-stripped by the normalise step above;
          # a step-level env here would shadow the cleaned value).
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=opsera-mid_project
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=coverage-raw/backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=coverage-raw/frontend/coverage/lcov.info

      - name: Quality Gate check
        id: quality-gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -d .scannerwork ] && cp -r .scannerwork report-out/ 2>/dev/null || true
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no local report — see SonarQube dashboard" > report-out/NO_REPORT.txt
          tar -czf sonarqube-report.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: sonarqube-report.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.quality-gate.outcome }}" == "success" ]; then
            echo "✅ sonarqube: Quality Gate passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ sonarqube: Quality Gate failed — see ${{ secrets.SONAR_HOST_URL }} for details" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Build -> SBOM -> Grype -> ACS -> Docker Hub -> Scout -> sign.
  #
  # One job per stage, so every gate appears as its own entry in the
  # Actions UI and any single stage can be re-run on its own
  # ("Re-run failed jobs") instead of the whole chain.
  #
  # Splitting this up is only possible because the image now travels
  # BETWEEN jobs through GHCR: every job starts on a fresh VM with no
  # local image, so each stage logs in and re-pulls what it needs. The
  # stages are wired with `needs` so the gate order is unchanged —
  # sbom-scan and acs-check both fan out from build and both gate
  # promote, and nothing reaches Docker Hub, cosign or the cluster
  # until every gate above it is green.
  #
  # Consequence of using GHCR as the hand-off: the push to GHCR now
  # happens in the build stage, i.e. BEFORE Grype. GHCR is a private
  # staging registry and nothing is promoted out of it until all gates
  # pass, so this changes the timing of the pre-push scan, not whether
  # it gates promotion/signing/deployment. (To keep "no unscanned image
  # in any registry", build a `docker save` tar artifact instead of
  # pushing — slower and much larger, which is why GHCR is used here.)
  # ============================================================
  build:
    name: build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [sonarqube]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        id: build
        continue-on-error: true
        run: docker build -t "$GHCR_IMAGE" ./${{ matrix.component }}

      # ---- Stage hand-off: every later stage pulls this image ----
      - name: Log in to GHCR
        id: ghcr-login
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR (staging hand-off)
        id: push-ghcr
        if: steps.ghcr-login.outcome == 'success'
        continue-on-error: true
        run: docker push "$GHCR_IMAGE"

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.push-ghcr.outcome }}" == "success" ]; then
            echo "✅ build (${{ matrix.component }}): image built and staged at $GHCR_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see job log"
            [ "${{ steps.build.outcome }}" != "success" ] && REASON="docker build failed"
            [ "${{ steps.ghcr-login.outcome }}" != "success" ] && [ "${{ steps.build.outcome }}" == "success" ] && REASON="GHCR login failed"
            [ "${{ steps.push-ghcr.outcome }}" != "success" ] && [ "${{ steps.ghcr-login.outcome }}" == "success" ] && REASON="GHCR push failed"
            echo "❌ build (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 4 — SBOM + Grype, on the image `build` staged in GHCR.
  # The SBOM is uploaded as an artifact because the signing stage
  # needs it later to `cosign attach sbom`.
  # ============================================================
  sbom-scan:
    name: Gate 4 · SBOM + Grype (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        id: ghcr-login
        continue-on-error: true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull staged image from GHCR
        id: pull
        if: steps.ghcr-login.outcome == 'success'
        continue-on-error: true
        run: docker pull "$GHCR_IMAGE"

      - name: Generate SBOM (syft)
        id: syft
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.json

      # ---- Gate 4: Grype on the SBOM, no registry involved ----
      # ACS/roxctl needs a registry reference to scan — it queries the
      # registry for image metadata rather than reading local layers, so a
      # true registry-free pre-push scan has to use Grype here instead.
      #
      # v4 is pinned to Grype 0.80.0, which only understands the grype-db
      # schema v5 feed. That schema reached EOL on 2026-03-06, so v4 can only
      # ever fetch a DB that is now ~28 weeks old — which Grype then rejects
      # as invalid while scan-action reports the run as "Found vulnerabilities
      # with level 'high' or higher". That is a phantom result, not a real
      # finding. v7 installs a current Grype that reads the live DB feed.
      - name: Scan SBOM with Grype
        id: grype
        if: steps.syft.outcome == 'success'
        continue-on-error: true
        uses: anchore/scan-action@v7
        with:
          sbom: sbom-${{ matrix.component }}.json
          fail-build: true
          severity-cutoff: ${{ env.GRYPE_SEVERITY_THRESHOLD }}
          # Fail only on High+ CVEs that actually have a fix published.
          # Blocking on unfixable findings (e.g. tiff/zlib with no upstream
          # patch) gives a red build nobody can act on; they still appear
          # in the JSON/SARIF report artifact.
          only-fixed: true
          output-format: json

      # Consumed by the `sign` job for `cosign attach sbom`.
      - uses: actions/upload-artifact@v4
        if: steps.syft.outcome == 'success'
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json
          retention-days: 1

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          find . -maxdepth 1 -iname "*grype*.json" -exec cp {} report-out/ \; 2>/dev/null || true
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf grype-report-${{ matrix.component }}.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report-${{ matrix.component }}
          path: grype-report-${{ matrix.component }}.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.grype.outcome }}" == "success" ]; then
            echo "✅ Gate 4 Grype (${{ matrix.component }}): passed — no fixable CVEs at or above ${{ env.GRYPE_SEVERITY_THRESHOLD }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see grype-report-${{ matrix.component }} artifact and job log for the failing step"
            [ "${{ steps.syft.outcome }}" != "success" ] && [ "${{ steps.pull.outcome }}" == "success" ] && REASON="SBOM generation failed"
            [ "${{ steps.grype.outcome }}" != "success" ] && [ "${{ steps.syft.outcome }}" == "success" ] && REASON="vulnerabilities at or above ${{ env.GRYPE_SEVERITY_THRESHOLD }} found"
            echo "❌ Gate 4 Grype (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 5 — ACS policy check against the staged GHCR image.
  # Prerequisite: a GHCR Image Integration must already be configured
  # in ACS Central, or this fails with "no matching image registries found".
  # ============================================================
  acs-check:
    name: Gate 5 · ACS (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. The "latest" mirror URL silently ships a newer
      # roxctl that removed the --token flag, so an unpinned download breaks
      # the step on Anchore/Red Hat's release cadence rather than ours.
      - name: roxctl setup
        id: roxctl-setup
        continue-on-error: true
        run: |
          curl -sSL -o roxctl "https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl"
          chmod +x roxctl
          ./roxctl version

      - name: ACS image check (Gate 5)
        id: acs-check
        if: steps.roxctl-setup.outcome == 'success'
        continue-on-error: true
        env:
          # roxctl 4.x takes the API token via the environment; the old
          # --token flag no longer exists and aborts with "unknown flag".
          ROX_ENDPOINT: ${{ secrets.ROX_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
          ROX_INSECURE_CLIENT_SKIP_TLS_VERIFY: "true"
        run: |
          ./roxctl image check \
            --image="$GHCR_IMAGE" \
            --output json > acs-check-${{ matrix.component }}.json

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -f acs-check-${{ matrix.component }}.json ] && cp acs-check-${{ matrix.component }}.json report-out/
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf acs-report-${{ matrix.component }}.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acs-report-${{ matrix.component }}
          path: acs-report-${{ matrix.component }}.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.acs-check.outcome }}" == "success" ]; then
            echo "✅ Gate 5 ACS (${{ matrix.component }}): passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see acs-report-${{ matrix.component }} artifact and job log"
            [ "${{ steps.roxctl-setup.outcome }}" != "success" ] && REASON="could not download roxctl"
            [ "${{ steps.acs-check.outcome }}" != "success" ] && [ "${{ steps.roxctl-setup.outcome }}" == "success" ] && REASON="ACS policy violation"
            echo "❌ Gate 5 ACS (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Promote to Docker Hub: exact bytes that passed every gate, no
  # rebuild. Docker Hub replaces Quay for this project (mentor-approved
  # scope deviation — Quay was the registry named in the original brief).
  #
  # needs BOTH gate jobs, so a Grype or ACS failure stops the promotion
  # even though the two gates run in parallel.
  # ============================================================
  promote-dockerhub:
    name: promote to Docker Hub (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [sbom-scan, acs-check]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
      FINAL_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Promote to Docker Hub (skopeo)
        id: promote-dockerhub
        continue-on-error: true
        run: |
          docker run --rm quay.io/skopeo/stable copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            "docker://$GHCR_IMAGE" \
            "docker://$FINAL_IMAGE"
        # Note: the skopeo CLI image itself is pulled from quay.io/skopeo/stable
        # purely as a tool container — this is unrelated to where we store
        # our own application images, which are Docker Hub per the decision above.

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.promote-dockerhub.outcome }}" == "success" ]; then
            echo "✅ promote (${{ matrix.component }}): $FINAL_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ promote (${{ matrix.component }}): failed — Docker Hub promotion failed (see job log)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Gate 6 — Docker Scout CVE scan.
  # Unlike Quay, Docker Hub does not scan pushed images automatically
  # on a free/personal plan, so this has to be an explicit step here
  # rather than something that "just happens" after the push.
  #
  # Pinned deliberately, same reason as roxctl above: the unpinned
  # installer pulls whatever Docker published most recently, and Scout
  # renamed --ignore-unfixed to --only-fixed. An unpinned CLI broke this
  # gate on Docker's release cadence rather than ours.
  # ============================================================
  scout:
    name: Gate 6 · Docker Scout (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [promote-dockerhub]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      FINAL_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Scout
        id: scout-setup
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s -- -b "$HOME/.docker/cli-plugins"
          docker scout version

      - name: Gate 6 — Docker Scout CVE scan
        id: scout-scan
        if: steps.scout-setup.outcome == 'success'
        continue-on-error: true
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # --only-fixed (formerly --ignore-unfixed) keeps this gate in parity
          # with Grype's only-fixed: true: fail on fixable High+ CVEs, report
          # unfixable ones without blocking, since no upstream patch exists.
          docker scout cves "$FINAL_IMAGE" \
            --exit-code --only-severity critical,high --only-fixed \
            --output scout-${{ matrix.component }}.json --format sarif

      - name: Archive report
        if: always()
        run: |
          mkdir -p report-out
          [ -f scout-${{ matrix.component }}.json ] && cp scout-${{ matrix.component }}.json report-out/
          [ -z "$(ls -A report-out 2>/dev/null)" ] && echo "no report produced" > report-out/NO_REPORT.txt
          tar -czf scout-report-${{ matrix.component }}.tar.gz -C report-out .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report-${{ matrix.component }}
          path: scout-report-${{ matrix.component }}.tar.gz
          retention-days: 7

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.scout-scan.outcome }}" == "success" ]; then
            echo "✅ Gate 6 Scout (${{ matrix.component }}): passed — no fixable CRITICAL/HIGH CVEs" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see scout-report-${{ matrix.component }} artifact and job log"
            [ "${{ steps.scout-setup.outcome }}" != "success" ] && REASON="could not install Docker Scout"
            [ "${{ steps.scout-scan.outcome }}" != "success" ] && [ "${{ steps.scout-setup.outcome }}" == "success" ] && REASON="Docker Scout found CRITICAL/HIGH CVEs"
            echo "❌ Gate 6 Scout (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Sign the promoted image + attach the SBOM from Gate 4 as an
  # attestation. Last gate before the manifest is bumped, so nothing
  # unsigned can be deployed.
  # ============================================================
  sign:
    name: sign + attach SBOM (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [scout]
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      FINAL_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # The SBOM was generated in the Gate 4 job; cosign attach sbom needs
      # the file itself, so it travels as an artifact rather than a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom

      - name: Install cosign
        id: cosign-setup
        continue-on-error: true
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM
        id: sign
        if: steps.cosign-setup.outcome == 'success'
        continue-on-error: true
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # cosign 2.x removed --registry-creds; it resolves registry
          # credentials from the ambient docker config. Logging in first also
          # keeps the token out of argv, where it would be visible in the
          # process list and echoed by any shell tracing.
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # printf, not echo: a secret pasted with a trailing newline would
          # otherwise corrupt the PEM and fail key parsing with a vague error.
          printf '%s\n' "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --yes "$FINAL_IMAGE"
          cosign attach sbom --sbom sbom/sbom-${{ matrix.component }}.json "$FINAL_IMAGE"
          rm -f cosign.key
          docker logout docker.io

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.sign.outcome }}" == "success" ]; then
            echo "✅ sign (${{ matrix.component }}): signed image at $FINAL_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see job log"
            [ "${{ steps.cosign-setup.outcome }}" != "success" ] && REASON="could not install cosign"
            [ "${{ steps.sign.outcome }}" != "success" ] && [ "${{ steps.cosign-setup.outcome }}" == "success" ] && REASON="cosign signing or SBOM attach failed"
            echo "❌ sign (${{ matrix.component }}): failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ============================================================
  # Update the separate GitOps manifest repo with the new, signed
  # image tags. ArgoCD watches that repo and syncs the cluster —
  # this job never touches the OpenShift cluster directly.
  # ============================================================
  update-manifest:
    runs-on: ubuntu-latest
    # Runs only once every component has passed all gates, `sign` included —
    # the manifest must never point at an unsigned image.
    needs: [sign]
    env:
      # Accept the repo slug from either a repository Variable or a Secret.
      # They are easy to confuse (Settings -> Secrets and variables -> Actions
      # has two separate tabs), and a slug stored in the wrong one silently
      # expands to an empty string, which produced the unhelpful
      # "repository 'https://github.com/.git/' not found" below.
      MANIFEST_REPO: ${{ vars.MANIFEST_REPO || secrets.MANIFEST_REPO }}
    steps:
      - name: Resolve manifest repo slug
        id: cfg
        continue-on-error: true
        run: |
          SLUG="$(printf '%s' "$MANIFEST_REPO" | tr -d '[:space:]')"
          if [ -z "$SLUG" ]; then
            echo "::error::MANIFEST_REPO is empty. Set it under Settings -> Secrets and variables -> Actions, as EITHER a Variable OR a Secret, to owner/repo (currently expected: mhmdmstfa2010/opsera-mid_project_cd)."
            exit 1
          fi
          echo "MANIFEST_REPO=$SLUG" >> "$GITHUB_ENV"
          echo "using manifest repo: $SLUG"

      - name: Clone manifest repo
        id: clone
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        run: |
          git clone "https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/${{ env.MANIFEST_REPO }}.git" manifests
          cd manifests
          git config user.email "pipeline-bot@ci"
          git config user.name "pipeline-bot"

      - name: Bump image tags
        id: bump
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        working-directory: manifests
        run: |
          # TODO(validate): adjust paths/keys to match your actual kustomize
          # or plain-YAML layout — this assumes a kustomization.yaml per
          # component under overlays/production/
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" overlays/production/backend/kustomization.yaml
          sed -i "s#newTag: .*#newTag: ${{ github.sha }}#" overlays/production/frontend/kustomization.yaml
          git commit -am "bump backend+frontend to ${{ github.sha }}" || echo "nothing to commit"

      - name: Push manifest repo
        id: push-manifest
        if: steps.bump.outcome == 'success'
        continue-on-error: true
        working-directory: manifests
        run: git push

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.push-manifest.outcome }}" == "success" ]; then
            echo "✅ update-manifest: passed — ArgoCD will sync commit ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            REASON="see job log"
            [ "${{ steps.cfg.outcome }}" != "success" ] && REASON="MANIFEST_REPO not set (Variable or Secret) — no repo slug to clone"
            [ "${{ steps.clone.outcome }}" != "success" ] && [ "${{ steps.cfg.outcome }}" == "success" ] && REASON="could not clone manifest repo — check MANIFEST_REPO_TOKEN scope and repo name"
            [ "${{ steps.bump.outcome }}" != "success" ] && [ "${{ steps.clone.outcome }}" == "success" ] && REASON="failed to update kustomization.yaml — check paths"
            [ "${{ steps.push-manifest.outcome }}" != "success" ] && [ "${{ steps.bump.outcome }}" == "success" ] && REASON="git push rejected — check branch protection/token scope"
            echo "❌ update-manifest: failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi