# ==============================================================================
# update-manifest.yml
# ==============================================================================
# FUNCTION
#   Clones the GitOps manifest repo, rewrites the backend and frontend image
#   references to immutable digests, and opens a pull request for a human to
#   review and merge. It never deploys and never touches the cluster.
#
# ROLE IN PIPELINE
#   Final stage - raises the digest-pinned manifest bump PR.
#
# SECRETS READ
#   - MANIFEST_REPO_TOKEN
#   - MANIFEST_REPO
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN
#
# REPOSITORY VARIABLES READ
#   - MANIFEST_REPO
#   - DOCKERHUB_NAMESPACE
#
# NOTES
#   MANIFEST_REPO may be provided as EITHER a variable or a secret; the workflow
#   accepts `vars.MANIFEST_REPO || secrets.MANIFEST_REPO`.
#   The rewrite writes a kustomize `digest:` field. It must NOT be written into
#   `newTag:` - kustomize would accept a sha256 value there and emit a *tag*
#   that cannot be resolved. The pattern matches (newTag|digest) so re-runs do
#   not silently no-op and pin a stale digest.
# ==============================================================================

name: propose-manifest-bump

on:
  workflow_call:

permissions:
  contents: read

jobs:
  update-manifest:
    name: propose manifest bump (PR)
    runs-on: ubuntu-latest
    env:
      MANIFEST_REPO: ${{ vars.MANIFEST_REPO || secrets.MANIFEST_REPO }}
    steps:
      - name: Resolve manifest repo slug
        id: cfg
        continue-on-error: true
        run: |
          SLUG="$(printf '%s' "$MANIFEST_REPO" | tr -d '[:space:]')"
          if [ -z "$SLUG" ]; then
            echo "::error::MANIFEST_REPO is empty. Set it under Settings -> Secrets and variables -> Actions, as EITHER a Variable OR a Secret, to owner/repo (currently expected: mhmdmstfa2010/opsera-mid_project_cd)."
            exit 1
          fi
          echo "MANIFEST_REPO=$SLUG" >> "$GITHUB_ENV"
          echo "using manifest repo: $SLUG"

      - name: Clone manifest repo
        id: clone
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        run: |
          git clone "https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/${{ env.MANIFEST_REPO }}.git" manifests
          cd manifests
          git config user.email "pipeline-bot@ci"
          git config user.name "pipeline-bot"

      - name: Resolve promoted image digests
        id: resolve
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            ref="docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${component}:${{ github.sha }}"
            digest="$(skopeo inspect --tls-verify --creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
                       --format '{{.Digest}}' "docker://$ref")"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::unexpected digest '$digest' for $ref"; exit 1 ;;
            esac
            echo "digest_${component}=$digest" >> "$GITHUB_OUTPUT"
            echo "$component: $ref -> $digest"
          done

      - name: Bump image refs to digests
        id: bump
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        working-directory: manifests
        env:
          BACKEND_DIGEST: ${{ steps.resolve.outputs.digest_backend }}
          FRONTEND_DIGEST: ${{ steps.resolve.outputs.digest_frontend }}
        run: |
          set -euo pipefail
          # The alternation on (newTag|digest) is load-bearing: after the
          # first run the file already says `digest:`, so a `newTag:`-only
          # pattern silently no-ops and CI would open a PR pinning a STALE
          # digest. Verified against the real manifest repo.
          sed -E -i "s#^([[:space:]]*)(newTag|digest): .*#\1digest: ${BACKEND_DIGEST}#" \
            overlays/production/backend/kustomization.yaml
          sed -E -i "s#^([[:space:]]*)(newTag|digest): .*#\1digest: ${FRONTEND_DIGEST}#" \
            overlays/production/frontend/kustomization.yaml
          git diff --stat
          git diff

      - name: Open pull request against the GitOps repo
        id: pr
        if: steps.bump.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifests
          branch: ci/bump-image-tags
          add-paths: |
            overlays/production/backend/kustomization.yaml
            overlays/production/frontend/kustomization.yaml
          delete-branch: true
          commit-message: "pin backend+frontend to immutable digests (${{ github.sha }})"
          title: "Pin backend+frontend to ${{ github.sha }} (backend + frontend)"
          body: |
            Automated digest-pinned image bump from [`${{ github.repository }}`@`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            The images are pinned **by digest** (`@sha256:…`), not by the
            mutable `${{ github.sha }}` tag. Kustomize emits these as
            `image: docker.io/…@sha256:…`, so a re-push of the same tag can
            no longer change what ArgoCD deploys.

            | Component | Image (digest-pinned) |
            | --- | --- |
            | backend | `docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/backend@${{ steps.resolve.outputs.digest_backend }}` |
            | frontend | `docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/frontend@${{ steps.resolve.outputs.digest_frontend }}` |

            Readable aliases for the same commit still exist on Docker Hub
            under `:${{ github.sha }}`.

            Both images passed every gate before this PR was raised:
            gitleaks, lint, unit tests, SonarQube Quality Gate, Syft SBOM,
            Grype, ACS policy check and cosign signing.

            **Nothing in this repo has been modified yet.** Merging this PR is
            what makes ArgoCD sync the new images to the cluster.

      - name: Pass/fail message
        if: always()
        run: |
          if [ "${{ steps.pr.outcome }}" == "success" ]; then
            if [ "${{ steps.pr.outputs.pull-request-number }}" != "" ]; then
              echo "✅ manifest: PR #${{ steps.pr.outputs.pull-request-number }} opened — review and merge to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "${{ steps.pr.outputs.pull-request-number }}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "ℹ️ manifest: digests already current — no PR needed" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            REASON="see job log"
            [ "${{ steps.cfg.outcome }}" != "success" ] && REASON="MANIFEST_REPO not set (Variable or Secret) — no repo slug to clone"
            [ "${{ steps.clone.outcome }}" != "success" ] && [ "${{ steps.cfg.outcome }}" == "success" ] && REASON="could not clone manifest repo — check MANIFEST_REPO_TOKEN scope and repo name"
            [ "${{ steps.resolve.outcome }}" != "success" ] && [ "${{ steps.clone.outcome }}" == "success" ] && REASON="could not resolve the promoted image digest on Docker Hub — the image may not have been promoted"
            [ "${{ steps.bump.outcome }}" != "success" ] && [ "${{ steps.resolve.outcome }}" == "success" ] && REASON="failed to update kustomization.yaml — check paths"
            [ "${{ steps.pr.outcome }}" != "success" ] && [ "${{ steps.bump.outcome }}" == "success" ] && REASON="could not open the pull request — the token pushed the branch but GitHub refused the PR. 'Resource not accessible by personal access token' means MANIFEST_REPO_TOKEN lacks the pull-request scope: fine-grained PATs need 'Pull requests: Read & write' (classic PATs need 'repo'). If the scope is already right, the PAT is probably scoped to the wrong repository."
            echo "❌ manifest: failed — $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
